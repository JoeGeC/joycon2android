name: Prerelease

# Publishes a shareable debug APK from the current branch. Workflow artifacts need a GitHub
# login to download, so a prerelease is what gives testers a plain URL.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version this build is heading for, e.g. 1.0.3 (default: versionName in build.gradle.kts)"
        required: false
        type: string
      notes:
        description: What to try in this build (shown in the release body)
        required: false
        type: string

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without this, Gradle generates a throwaway debug key per run: every build would then
      # refuse to install over the last one, testers included.
      - name: Restore the shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: this build gets a throwaway signature and will not install over any other build."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build, test, lint, and enforce architecture rules
        run: ./gradlew build :konsist:test --stacktrace

      # versionName only catches up on a release branch, so between releases it names the
      # version already out, not the one this build is heading for.
      - name: Name the APK after what it is
        id: apk
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="$VERSION"
          if [ -z "$version" ]; then
            version=$(grep -m1 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          elif ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.0.3, got '$version'"
            exit 1
          fi
          name="joycon2android-${version}-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-debug.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "Debug build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}."
            if [ -n "$NOTES" ]; then echo; echo "$NOTES"; fi
          } > notes.md
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "${{ steps.apk.outputs.version }} debug (${GITHUB_SHA::7})" \
            --notes-file notes.md
